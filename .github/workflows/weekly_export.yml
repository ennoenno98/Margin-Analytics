name: Novadata Weekly Export

on:
  schedule:
    # Jeden Montag um 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:  # Ermöglicht manuellen Start per Knopfdruck

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: pip install requests pandas openpyxl

      - name: Export ausführen
        run: python novadata_weekly_export.py --once

      - name: Exportdatei als Artifact speichern
        uses: actions/upload-artifact@v4
        with:
          name: margin-export-${{ github.run_id }}
          path: novadata_exports/
          retention-days: 90  # Dateien werden 90 Tage aufbewahrt
