name: Novadata Daily Export

on:
  schedule:
    # Täglich um 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write   # Damit der Workflow den frischen Export committen kann

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements-export.txt

      - name: Export ausführen
        run: python novadata_weekly_export.py --once

      - name: Exportdatei als Artifact speichern
        uses: actions/upload-artifact@v4
        with:
          name: margin-export-${{ github.run_id }}
          path: novadata_exports/
          retention-days: 90  # Dateien werden 90 Tage aufbewahrt

      - name: Export in Repo committen (für das Streamlit-Dashboard)
        run: |
          if [[ -n "$(git status --porcelain novadata_exports/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add novadata_exports/
            git commit -m "data: weekly Novadata refresh"
            git push
          else
            echo "Keine neuen Daten."
          fi
