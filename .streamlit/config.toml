[theme]
# Vanatari corporate design (see brand.py / Corporate Design Booklet 2026)
base = "light"
primaryColor = "#ff5c3e"             # Warm Orange — highlights / accent
backgroundColor = "#fbf7f2"          # Light Beige — app background
secondaryBackgroundColor = "#e3eef6" # Light Blue — sidebar / cards
textColor = "#3c1826"                # Dark Plum — text / ink

[browser]
gatherUsageStats = false

[server]
headless = true
